<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCULUS FIRDUS - Bağımsız Ücretsiz APK & Oyun Mağazası</title>

  <!-- Mobil PWA / APK Desteği Meta Etiketleri -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oculus Firdus">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .store-card {
      background: #111827;
      border: 1px solid #1f2937;
    }
  </style>
</head>
<body class="bg-gray-950 text-slate-100 min-h-screen">

  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-gamepad text-2xl text-emerald-400"></i>
        <h1 class="text-xl font-bold tracking-tight">Oculus Firdus</h1>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20 font-mono">PWA Aktif</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-gray-950 via-gray-900 to-emerald-950/40 border border-emerald-500/30 p-6 sm:p-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-3 border border-emerald-500/20">
        <i class="fa-solid fa-check-double"></i> %100 Ücretsiz & Açık Kaynak
      </div>
      <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-2">DOĞRUDAN TELEFON & WEB'E APK DAĞITIMI</h2>
      <p class="text-gray-300 text-sm sm:text-base max-w-xl mb-6">
        Aracı, komisyon veya hesap kopyaları yok. Bağımsız geliştiricilerin APK paketlerini ve açık kaynak uygulamalarını doğrudan edinin.
      </p>
      <div class="flex flex-wrap items-center gap-3">
        <button class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 transition">
          <i class="fa-solid fa-plus"></i> Kendi APK / Projeni Yayınla
        </button>
        <button class="px-5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-emerald-400 font-bold text-xs flex items-center gap-2 border border-gray-700 transition">
          <i class="fa-solid fa-futbol"></i> Canlı Futbol & Halı Saha Hub
        </button>
      </div>
    </div>

    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="store-card rounded-2xl p-5 border border-gray-800 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-mono text-emerald-400">Canlı Ekosistem</span>
          <span class="text-xs bg-gray-800 text-gray-400 px-2 py-0.5 rounded">v1.0</span>
        </div>
        <h3 class="text-lg font-bold">Slot Cup Hub</h3>
        <p class="text-gray-400 text-xs">Futbol turnuva ve maç takip arayüzü.</p>
        <button class="w-full py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-semibold text-white transition">İncele</button>
      </div>
    </section>
  </main>

</body>
</html>
